name: Daily Contributions

on:
  schedule:
    # запускается каждый час в окне 08:00-16:00 UTC = 13:00-21:00 по Екатеринбургу/Кургану
    # (плюс случайная задержка внутри часа добавляет ещё около часа сверху, так что фактически охватывает до ~22:00)
    - cron: '0 8-16 * * *'
  workflow_dispatch:

jobs:
  contribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pick random hour, wait, then commit
        run: |
          # выбираем "случайный" час на сегодня (08-16 UTC), одинаковый для всех запусков этого дня
          TODAY=$(date -u +%Y%m%d)
          SEED=$(echo -n "$TODAY-contrib-seed" | cksum | cut -d' ' -f1)
          HOURPICK=$(( 8 + SEED % 9 ))
          CURRENT_HOUR=$(date -u +%H)

          if [ "$CURRENT_HOUR" != "$(printf '%02d' "$HOURPICK")" ]; then
            echo "Не тот час (сегодня выбран $HOURPICK, сейчас $CURRENT_HOUR) — выходим"
            exit 0
          fi

          # случайная задержка 0-59 минут внутри выбранного часа
          SLEEP_MIN=$(( RANDOM % 60 ))
          echo "Час подошёл ($HOURPICK UTC), ждём ещё $SLEEP_MIN минут"
          sleep $(( SLEEP_MIN * 60 ))

          # веса (из 100): 1=5%, 2=9%, 3=12%, 4=26%, 5=19%, 6=29%
          R=$(( RANDOM % 100 ))
          if   [ "$R" -lt 5  ]; then COUNT=1
          elif [ "$R" -lt 14 ]; then COUNT=2
          elif [ "$R" -lt 26 ]; then COUNT=3
          elif [ "$R" -lt 52 ]; then COUNT=4
          elif [ "$R" -lt 71 ]; then COUNT=5
          else COUNT=6
          fi
          echo "Сегодня будет $COUNT коммит(ов)"

          for i in $(seq 1 "$COUNT"); do
            TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            echo "$TS - commit $i/$COUNT" >> contributions.log
            git add contributions.log
            git commit -m "chore: daily update ($i/$COUNT)"
          done

          git push

